name: update-gitcalendar

on:
  schedule:
    - cron: '23 20 * * *' # 每日 UTC 20:23（北京时间 04:23）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gitcalendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build gitcalendar.json
        run: node build.js

      - name: Commit when changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitcalendar.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh gitcalendar $(date -u +%F)"
            git push
          fi
